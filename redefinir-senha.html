<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redefinir senha — ALUGAÊ</title>
  <meta name="description" content="Recupere o acesso à sua conta na plataforma ALUGAÊ." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <style>
    .auth-container {
      max-width: 460px;
      margin: 3rem auto 6rem;
      padding: 0 1rem;
    }
    .auth-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-xl);
      padding: clamp(1.5rem, 5vw, 2.5rem);
      box-shadow: var(--shadow-sm);
    }
    .auth-feedback {
      margin-bottom: 1.25rem;
      padding: 0.75rem 1rem;
      border-radius: var(--r-md);
      font-size: 0.875rem;
      display: none;
    }
    .auth-feedback.is-error {
      display: block;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid var(--error);
      color: var(--error);
    }
    .auth-feedback.is-success {
      display: block;
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid var(--success);
      color: var(--success);
    }
  </style>
</head>
<body>

  <!-- Nav injected by main.js -->

  <main class="page-wrapper">
    <div class="auth-container">
      
      <!-- Card 1: Solicitar link de redefinição -->
      <div id="request-password-card" class="auth-card page-enter">
        <header style="text-align:center;margin-bottom:2rem;">
          <p class="section-eyebrow">Recuperação</p>
          <h1 style="font-size:1.85rem;margin:0.25rem 0 0.5rem;letter-spacing:-0.02em;">Esqueceu a senha?</h1>
          <p style="color:var(--text-3);font-size:0.95rem;">Informe seu e-mail cadastrado e enviaremos um link de redefinição.</p>
        </header>

        <div id="reset-request-feedback" class="auth-feedback" role="alert"></div>

        <form id="form-reset-request" novalidate>
          <div class="form-group" style="margin-bottom:1.5rem;">
            <label class="form-label" for="email-reset">Seu e-mail</label>
            <input class="form-input" type="email" id="email-reset" required placeholder="seu@email.com" />
          </div>

          <button class="btn btn-primary btn-lg" type="submit" style="width:100%;">
            Enviar link de recuperação
          </button>
        </form>

        <p style="text-align:center;margin-top:1.75rem;font-size:0.875rem;">
          <a href="login.html" style="color:var(--text-3);text-decoration:none;">&larr; Voltar para o login</a>
        </p>
      </div>

      <!-- Card 2: Definir nova senha (exibido quando o usuário abre o link do e-mail) -->
      <div id="update-password-card" class="auth-card page-enter" style="display:none;">
        <header style="text-align:center;margin-bottom:2rem;">
          <p class="section-eyebrow">Segurança</p>
          <h1 style="font-size:1.85rem;margin:0.25rem 0 0.5rem;letter-spacing:-0.02em;">Criar nova senha</h1>
          <p style="color:var(--text-3);font-size:0.95rem;">Digite sua nova senha abaixo.</p>
        </header>

        <div id="reset-update-feedback" class="auth-feedback" role="alert"></div>

        <form id="form-reset-update" novalidate>
          <div class="form-group" style="margin-bottom:1.25rem;">
            <label class="form-label" for="nova-senha">Nova senha</label>
            <input class="form-input" type="password" id="nova-senha" required minlength="8" placeholder="Mínimo 8 caracteres" />
          </div>

          <div class="form-group" style="margin-bottom:1.5rem;">
            <label class="form-label" for="confirma-nova-senha">Confirmar nova senha</label>
            <input class="form-input" type="password" id="confirma-nova-senha" required minlength="8" placeholder="Repita a nova senha" />
          </div>

          <button class="btn btn-primary btn-lg" type="submit" style="width:100%;">
            Salvar nova senha
          </button>
        </form>
      </div>

    </div>
  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
